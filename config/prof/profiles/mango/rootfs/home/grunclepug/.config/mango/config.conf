# prof playground: mango — "flat" (a quiet test of how mango works, not how it looks).
# Validate:  mango -c ~/.config/mango/config.conf -p
# Previous dwm-lookalike version: ~/.config/prof/backups/2026-10-03-dwm-lookalike/
#
# Two layers of keys:
#   Alt   = your dwm keys, unchanged (deviations marked "dwm:")
#   Super = what mango does that dwm can't: overview, scroller/grid/deck
#           layouts, a drop-down terminal, minimize, directional focus
#
# This is the "flat" pass: no blur, no rounding, no shadows, no animation.
# It looks like dwm on purpose, so what you're judging is how mango *works*,
# mainly the scroller layout (Super+s) and the overview (Super+Tab).
#
# Palette (teal from the roofs in the wallpaper, gold from the trim):
#   base 0e141a  line 2a3640  text e6edf0  dim 8fa3ad
#   teal 5fd4c4  gold f2c46d  rose ef6b73

# --- autostart (~/.xinitrc "Setup" block) -------------------------------
exec-once=pg-autostart mango

# --- look: flat, square, 2px teal border, dwm's 8px gaps ----------------
borderpx=2
border_radius=0
gappih=8
gappiv=8
gappoh=8
gappov=8
smartgaps=0
rootcolor=0x0e141aff
bordercolor=0x2a3640ff
focuscolor=0x5fd4c4ff
urgentcolor=0xef6b73ff
maximizescreencolor=0xf2c46dff
globalcolor=0xf2c46dff
scratchpadcolor=0x5fd4c4ff
overlaycolor=0xf2c46dff
dropcolor=0x5fd4c455
splitcolor=0x5fd4c4ff

blur=0
blur_layer=0
shadows=0
layer_shadows=0
focused_opacity=1.0
unfocused_opacity=1.0
dim_enable=0

# --- motion: off, like dwm ----------------------------------------------
# animations=0 is the whole switch. With it on, mango 0.17.4 runs every tag
# switch through its slide-in/slide-out path (even with all durations at 0),
# parking windows off-screen and toggling their visibility; flipping tags
# quickly makes terminals visibly jitter. Upstream has since reworked that
# code (client_update_visibility), so it's worth retrying after the next
# mangowm release. Touchpad swipes still follow your fingers either way.
animations=0
layer_animations=0
animation_duration_open=0
animation_duration_close=0
animation_duration_tag=0
animation_duration_focus=0
animation_duration_move=0

# --- behaviour (dwm defaults) --------------------------------------------
tag_num=9
new_is_master=1
default_mfact=0.55
default_nmaster=1
circle_layout=tile,monocle
sloppyfocus=1
warpcursor=0
focus_on_activate=0
view_current_to_back=0
enable_floating_snap=1
snap_distance=32
cursor_size=24
drag_tile_to_tile=1

# scroller (Super+s): niri-style horizontal strip of columns
scroller_structs=24
scroller_default_proportion=0.6
scroller_default_proportion_single=1.0
scroller_focus_center=0
scroller_prefer_center=1
scroller_proportion_preset=0.4,0.6,1.0

# overview (Super+Tab or a 4-finger swipe up)
overviewgappi=12
overviewgappo=40
enable_hotarea=0

# drop-down terminal (Super+Return)
scratchpad_width_ratio=0.7
scratchpad_height_ratio=0.6

# --- input: X server defaults + your xorg.conf.d touchpad ----------------
xkb_rules_layout=us
repeat_rate=25
repeat_delay=660
tap_to_click=1
tap_and_drag=1
drag_lock=0
trackpad_natural_scrolling=1
trackpad_disable_while_typing=1

# --- layouts: every tag starts in master/stack tile ----------------------
tagrule=id:1,layout_name:tile
tagrule=id:2,layout_name:tile
tagrule=id:3,layout_name:tile
tagrule=id:4,layout_name:tile
tagrule=id:5,layout_name:tile
tagrule=id:6,layout_name:tile
tagrule=id:7,layout_name:tile
tagrule=id:8,layout_name:tile
tagrule=id:9,layout_name:tile

# --- rules (dwm rules[]) -------------------------------------------------
windowrule=isfloating:1,appid:^[Gg]imp
windowrule=tags:9,appid:^[Ff]irefox$
windowrule=isnamedscratchpad:1,width:1340,height:720,appid:^dropdown$
windowrule=isfloating:1,appid:^(pavucontrol|org.pulseaudio.pavucontrol|nm-connection-editor)$

# --- keys (dwm keys[]) ---------------------------------------------------
bind=ALT,p,spawn,pg-mango-menu
bind=ALT+SHIFT,Return,spawn,foot -c ~/.config/mango/foot.ini
bind=ALT+SHIFT,s,spawn,vshot
bind=ALT+SHIFT,x,spawn,vshot -all
bind=ALT,b,spawn,pkill -USR1 -x waybar
bind=ALT,j,focusstack,next
bind=ALT,k,focusstack,prev
bind=ALT,i,incnmaster,+1
bind=ALT,d,incnmaster,-1
bind=ALT,h,setmfact,-0.05
bind=ALT,l,setmfact,+0.05
bind=ALT,Return,zoom
# dwm: view previous tagset. mango has no tag history, so this jumps to the
# previously focused window (and its tag), which is the same thing in practice.
bind=ALT,Tab,focuslast
bind=ALT+SHIFT,c,killclient
bind=ALT,t,setlayout,tile
# dwm: floating layout. mango has none; this floats/unfloats every visible window.
bind=ALT,f,toggle_all_floating
bind=ALT,m,setlayout,monocle
# dwm: swap to the previous layout. Cycles circle_layout (tile <-> monocle).
bind=ALT,space,switch_layout
bind=ALT+SHIFT,space,togglefloating
bind=ALT,0,view,00
bind=ALT+SHIFT,0,toggletag,0
bind=ALT,comma,focusmon,prev
bind=ALT,period,focusmon,next
bind=ALT+SHIFT,comma,tagmon,prev
bind=ALT+SHIFT,period,tagmon,next
bind=ALT,minus,incgaps,-1
bind=ALT,equal,incgaps,+1
# dwm: setgaps 0. Toggles gaps off and back on.
bind=ALT+SHIFT,equal,togglegaps
bind=ALT+SHIFT,q,quit

# --- tags (dwm TAGKEYS) --------------------------------------------------
bind=ALT,1,view,1
bind=ALT+CTRL,1,toggleview,1
bind=ALT+SHIFT,1,tag,1
bind=ALT+CTRL+SHIFT,1,toggletag,1
bind=ALT,2,view,2
bind=ALT+CTRL,2,toggleview,2
bind=ALT+SHIFT,2,tag,2
bind=ALT+CTRL+SHIFT,2,toggletag,2
bind=ALT,3,view,3
bind=ALT+CTRL,3,toggleview,3
bind=ALT+SHIFT,3,tag,3
bind=ALT+CTRL+SHIFT,3,toggletag,3
bind=ALT,4,view,4
bind=ALT+CTRL,4,toggleview,4
bind=ALT+SHIFT,4,tag,4
bind=ALT+CTRL+SHIFT,4,toggletag,4
bind=ALT,5,view,5
bind=ALT+CTRL,5,toggleview,5
bind=ALT+SHIFT,5,tag,5
bind=ALT+CTRL+SHIFT,5,toggletag,5
bind=ALT,6,view,6
bind=ALT+CTRL,6,toggleview,6
bind=ALT+SHIFT,6,tag,6
bind=ALT+CTRL+SHIFT,6,toggletag,6
bind=ALT,7,view,7
bind=ALT+CTRL,7,toggleview,7
bind=ALT+SHIFT,7,tag,7
bind=ALT+CTRL+SHIFT,7,toggletag,7
bind=ALT,8,view,8
bind=ALT+CTRL,8,toggleview,8
bind=ALT+SHIFT,8,tag,8
bind=ALT+CTRL+SHIFT,8,toggletag,8
bind=ALT,9,view,9
bind=ALT+CTRL,9,toggleview,9
bind=ALT+SHIFT,9,tag,9
bind=ALT+CTRL+SHIFT,9,toggletag,9

# --- mouse (dwm buttons[] on client windows) -----------------------------
mousebind=ALT,btn_left,moveresize,curmove
mousebind=ALT,btn_middle,togglefloating
mousebind=ALT,btn_right,moveresize,curresize

# --- Super: where mango shines --------------------------------------------
# overview: every window on every tag, click or Enter to jump
bind=SUPER,Tab,toggleoverview
# more layouts than dwm ever shipped
bind=SUPER,s,setlayout,scroller
bind=SUPER,g,setlayout,grid
bind=SUPER,d,setlayout,deck
bind=SUPER,c,setlayout,center_tile
bind=SUPER,v,setlayout,vertical_tile
# scroller: cycle column width 40/60/100%, or fill the screen
bind=SUPER,w,switch_proportion_preset
bind=SUPER,e,set_proportion,1.0
# drop-down terminal that keeps its state between toggles
bind=SUPER,Return,toggle_named_scratchpad,dropdown,none,foot -c ~/.config/mango/foot.ini --app-id dropdown
# directional focus and swapping (great in scroller and grid)
bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right
bind=SUPER,k,focusdir,up
bind=SUPER,j,focusdir,down
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,l,exchange_client,right
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,j,exchange_client,down
# window states
bind=SUPER,f,togglefullscreen
bind=SUPER,a,togglemaximizescreen
bind=SUPER,p,toggleglobal
bind=SUPER,i,minimized
bind=SUPER+SHIFT,i,restore_minimized
# jump through occupied tags only
bind=SUPER,Left,viewtoleft_have_client
bind=SUPER,Right,viewtoright_have_client
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# --- touchpad gestures ---------------------------------------------------
gesturebind=none,left,3,focusdir,right
gesturebind=none,right,3,focusdir,left
gesturebind=none,left,4,viewtoright_have_client
gesturebind=none,right,4,viewtoleft_have_client
gesturebind=none,up,4,toggleoverview
gesturebind=none,down,4,toggleoverview

# --- extras dwm doesn't bind ---------------------------------------------
bind=ALT+SHIFT,r,reload_config
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl set +5%
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl set 5%-
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind=NONE,XF86AudioPlay,spawn,playerctl play-pause
bind=NONE,XF86AudioNext,spawn,playerctl next
bind=NONE,XF86AudioPrev,spawn,playerctl previous

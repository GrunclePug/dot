# prof playground: mango terminal (Alt+Shift+Return, Super+Return).
# Same font and block cursor as your st, a little more padding. Nearly opaque:
# with mango's blur off, see-through just turns the wallpaper into noise.
# The shared ~/.config/foot/foot.ini is untouched.
[main]
font=JetBrainsMono Nerd Font:pixelsize=12
pad=10x8

[cursor]
style=block
blink=no

[mouse]
hide-when-typing=yes

[colors-dark]
alpha=0.95
background=0e141a
foreground=d8e2e6
selection-background=2a3640
selection-foreground=e6edf0
cursor=0e141a 5fd4c4
urls=5fd4c4
regular0=1b252d
regular1=ef6b73
regular2=8fd18a
regular3=f2c46d
regular4=6aa7f0
regular5=c792ea
regular6=5fd4c4
regular7=c3ced3
bright0=4a5a66
bright1=ff8a90
bright2=a8e6a2
bright3=ffd88a
bright4=8cc0ff
bright5=dab0f5
bright6=8ae8db
bright7=f2f6f7

modules = [
  "base",
  "machine",  # /etc/arcus/modules/machine, written by arcus machine or the installer
  "shell",
  "dev",
  "docker",
  "desktop",
  "x11-base",
  "dwm",
  "wl-base",
  "apps",
  "syncthing",
  "arduino",
  "gaming",
  "battery",
]

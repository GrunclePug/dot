# ==============================================================================
# Picom Configuration - Modern Compositor for dwm (ThinkPad E14 / AMD GPU)
# ==============================================================================

# --- Backend & Performance ---
# GLX backend provides hardware-accelerated rendering and tear-free vsync on AMD
backend = "glx";
vsync = true;
use-damage = true;

# --- Window Opacity Rules ---
# Replaces the old transset-df shell hack with clean compositor-level opacity
opacity-rule = [
    "72:class_g = 'st-256color'",
    "72:class_g = 'st'"
];

# --- Shadows ---
# Replicates your xcompmgr settings (-c -C -t-5 -l-5 -r4.2 -o.72)
shadow = true;
shadow-radius = 6;
shadow-offset-x = -5;
shadow-offset-y = -5;
shadow-opacity = 0.72;
shadow-exclude = [
    "name = 'Notification'",
    "class_g = 'dunst'",
    "class_g = 'slstatus'",
    "class_g = 'dwm'",
    "_NET_WM_STATE *= '_NET_WM_STATE_HIDDEN'"
];

# --- Fading ---
fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
fade-delta = 10;

# --- General Settings ---
mark-wmwin-focused = true;
mark-ovldir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
log-level = "warn";

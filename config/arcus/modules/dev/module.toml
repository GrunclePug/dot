# lazy-lock.json is not part of the module (dot ignores it); nvim keeps
# its own copy in ~/.config/nvim.
description = "Development: Neovim, vi, tmux, git (GitHub sign-in through gh), C, Go, Odin, Rust, Python (uv), adb; Docker and Podman with no daemon at boot"
category    = "dev"
groups      = ["docker"]   # docker without sudo, once the daemon is started by hand
requires    = ["shell"]   # telescope searches with ripgrep and fd

[packages]
pacman = [
  "neovim", "nano",
  "ex-vi-compat",   # vi, for quick edits such as stream's config scratchpad
  "tmux", "git", "git-delta", "github-cli", "tree-sitter-cli",
  "clang",   # clangd for C
  "go", "odin", "raylib",
  "rustup",   # rust-analyzer comes from rustup too, in step with the toolchain
  "vulkan-swrast",   # lavapipe, software Vulkan for headless render tests
  "npm",   # Mason installs basedpyright and bash-language-server with it
  "uv",   # Python projects, tools and interpreters
  "android-tools",   # adb
  "gitleaks",   # look for committed secrets: gitleaks git <repo>
  # No units on purpose: start the daemon by hand (sudo systemctl start docker);
  # it never comes back on boot. Podman needs no daemon.
  "docker", "docker-compose", "podman",
]

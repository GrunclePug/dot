# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Vim Mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
#bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"

set -g mouse on

# Let nvim know when its pane gains focus (used to reload files changed by other tools)
set -g focus-events on

# Fast escape sequence handling (removes Neovim Esc key lag)
set -sg escape-time 10

# Generous history for AI CLI tools (agy, claude diffs/logs)
set -g history-limit 50000

# Modern terminal & TrueColor (24-bit RGB) support
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

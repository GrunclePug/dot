# The Secret Service (org.freedesktop.secrets) that libsecret and Electron's
# safeStorage use; T3 Code keeps its connection credentials there. The TTY
# login unlocks it with the login password (system/etc/pam.d), and passwd
# keeps the two passwords in step.
description = "gnome-keyring as the Secret Service, unlocked at login; T3 Code stores its secrets there"
category    = "desktop"
requires    = ["desktop"]

[packages]
pacman = ["gnome-keyring"]

[units]
user = ["gnome-keyring-daemon.socket"]
now  = true

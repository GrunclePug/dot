description = "bash, aliases, everyday command-line tools and helpers"
category    = "system"

[packages]
pacman = [
  "eza",   # ls, ll, la and tree (.alias)
  "fd", "fzf", "ripgrep", "dust", "ncdu", "btop", "fastfetch", "tealdeer", "jq", "wget",
  "zip", "unzip", "7zip", "unrar",
  "bitwarden-cli",   # bw
  "bash-completion", # Tab completion for git, systemctl, pacman…; /etc/bash.bashrc loads it
]

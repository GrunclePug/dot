description = "Arduino from the command line: arduino-cli, its language server, and a serial terminal"
category    = "dev"
groups      = ["uucp"]   # access to serial ports

[packages]
pacman = [
  "arduino-cli",               # compile, upload, monitor; ~/code/mcu/CLAUDE.md has the workflow
  "arduino-language-server",
  "picocom",                   # serial terminal for troubleshooting: flow control, break, line endings
]

# neon: the tmux status line and pane borders.
set -g status-style "bg=#444444,fg=#bbbbbb"
set -g window-status-current-style "bg=#ff00ff,fg=#eeeeee,bold"
set -g message-style "bg=#444444,fg=#ff00ff"
set -g pane-border-style "fg=#444444"
set -g pane-active-border-style "fg=#ff00ff"
set -g mode-style "bg=#ff00ff,fg=#eeeeee"

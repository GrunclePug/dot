# Coding agents on any machine, headless included: what wpo needs and Blender
# for agents to drive. Claude Code, Codex, agy and, on a headless box, T3 Code
# (t3) install and update themselves. The desktop app is t3-desktop.
description = "Coding agents: wpo's dependencies, Blender for agents to drive"
category    = "dev"
requires    = ["dev"]

[packages]
pacman = [
  "python-psutil",   # process queries for wpo (~/builds/wpo)
  "blender",         # for agents: scenes, renders and assets, headless with blender -b --python
]

# The stream session: river 0.5 with stream's swm as its window manager,
# started from a TTY with startw. swm and streamctl are installed by hand
# for now (sudo make install in the stream repo); a pkg/ recipe follows once
# stream is on GitHub.
description = "stream session: river 0.5 with swm, waybar fed by streamctl watch"
category    = "desktop"
requires    = ["wl-base"]
conflicts   = ["river-classic"]  # both packages own /usr/bin/river, and both modules ~/.config/river/

[packages]
pacman = ["river", "jq"]  # jq: the bar picks its monitor out of streamctl watch

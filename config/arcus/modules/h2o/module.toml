# One theme is on at a time: 'arcus on <theme>' swaps it for the others.
# Every app reads its colours from ~/.config/theme/ (colors.sh, colors.css,
# foot.ini, mako, tmux.conf, Xresources, stream); dunst takes its from a
# drop-in. A wallpaper.png next to them (not in git) is the theme's wallpaper.
description = "h2o: stream's theme, clear water blue on deep water"
category    = "theme"
conflicts   = ["nebula", "aurora"]

# The GTK stylesheets (gtk-3.0, gtk-4.0) read the active theme: keep a theme
# module on (aurora or nebula) with this one.
description = "Shared by every graphical session: fonts, audio, network applet, notifications, GTK styling, vshot"
category    = "desktop"

[packages]
pacman = [
  "fontconfig", "ttf-jetbrains-mono-nerd", "noto-fonts-cjk",
  "pipewire", "pipewire-alsa", "pipewire-pulse", "pipewire-jack", "alsa-utils",
  "pavucontrol", "qpwgraph",
  "network-manager-applet", "nm-connection-editor",
  "libnotify",
]
local = ["vshot"]   # pkg/vshot: built from a pinned commit on GitHub

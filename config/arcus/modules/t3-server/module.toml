# The T3 Code server on a headless machine. The desktop app writes the t3
# command the first time it opens, which never happens there; this is the
# same launcher for t3code-bin's bundled CLI. `t3 up` then runs the server
# as a user service, from its own copy of this version under ~/.t3/runtime.
# The version comes from aurlock: never `t3 update` here; `update` moves the
# service to a new t3code-bin.
description = "T3 Code server: the t3 command for t3code-bin's bundled CLI"
category    = "dev"
requires    = ["agents"]

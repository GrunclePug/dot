# One theme is on at a time: 'arcus on <theme>' swaps it for the others.
# Each app's colours sit next to its own config, which includes them
# (~/.config/foot/theme.ini, mako/theme, tmux/theme.conf, stream/theme; dunst
# takes a drop-in). The colours several apps share stay in ~/.config/theme/
# (colors.sh, colors.css, Xresources). Pictures/wallpaper.png (not in git)
# is the theme's wallpaper; arcus keeps the one it replaces as .orig.
description = "aurora: teal and gold on a near-black blue"
category    = "theme"
conflicts   = ["nebula", "h2o"]

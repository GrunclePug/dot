# aurora: dunst's colours, a drop-in over x11-base's dunstrc.
[global]
    frame_color = "#5fd4c4"

[urgency_low]
    background = "#0e141a"
    foreground = "#8fa3ad"
    frame_color = "#2a3640"

[urgency_normal]
    background = "#0e141a"
    foreground = "#d8e2e6"

[urgency_critical]
    background = "#2a1418"
    foreground = "#d8e2e6"
    frame_color = "#ef6b73"

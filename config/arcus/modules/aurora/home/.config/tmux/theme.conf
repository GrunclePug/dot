# aurora: the tmux status line and pane borders.
set -g status-style "bg=#1b252d,fg=#e6edf0"
set -g window-status-current-style "bg=#5fd4c4,fg=#0e141a,bold"
set -g message-style "bg=#1b252d,fg=#5fd4c4"
set -g pane-border-style "fg=#2a3640"
set -g pane-active-border-style "fg=#5fd4c4"
set -g mode-style "bg=#5fd4c4,fg=#0e141a"

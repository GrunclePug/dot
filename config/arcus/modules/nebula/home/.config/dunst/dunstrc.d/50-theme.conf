# nebula: dunst's colours, a drop-in over x11-base's dunstrc.
[global]
    frame_color = "#ff00ff"

[urgency_low]
    background = "#444444"
    foreground = "#bbbbbb"

[urgency_normal]
    background = "#222222"
    foreground = "#bbbbbb"

[urgency_critical]
    background = "#900000"
    foreground = "#ffffff"
    frame_color = "#ff0000"

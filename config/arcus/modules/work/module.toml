# The work laptop's own tools, on top of the laptop profile (its host file).
# Its wallpaper stays a local file: use a theme with no wallpaper of its own
# (not h2o), and .gitignore keeps theme wallpapers out of dot anyway.
# system/: browser's Zen and Helium policies with LastPass in place of
# Bitwarden (a browser reads one policy file, so these replace browser's).
# Change them together with browser's.
description = "Work tools: LibreOffice, Wireshark, WinBox, sshfs; LastPass in the browsers"
category    = "apps"
groups      = ["wireshark"]   # captures without root

[packages]
pacman = ["libreoffice-fresh", "wireshark-qt", "sshfs"]
aur    = ["winbox"]   # MikroTik RouterOS configurator

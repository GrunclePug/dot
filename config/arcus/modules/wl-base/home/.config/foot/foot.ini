# The shared terminal, dressed as st: same font, 2px border, block cursor.
# alpha=0.72 stands in for picom's "72:class_g = 'st'" opacity rule (foot
# keeps the text itself opaque); alpha-mode=all applies it to every cell, as
# picom does to the whole window, so apps that paint their own background
# (nvim) are see-through too. Colours come from the active theme.
[main]
include=~/.config/foot/theme.ini
font=JetBrainsMono Nerd Font:pixelsize=12
pad=2x2

[cursor]
style=block
blink=no

[colors-dark]
alpha=0.72
alpha-mode=all

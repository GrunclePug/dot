# Fallback for every wlroots session (river ships no portals.conf): screen
# sharing and screenshots go through wlr, everything else (file pickers, ...)
# through gtk.
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.Inhibit=none

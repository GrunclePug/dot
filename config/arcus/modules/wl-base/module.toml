description = "Shared Wayland session: terminal, menu, bar, notifications, helper scripts"
category    = "desktop"
requires    = ["desktop"]

[packages]
pacman = [
  "foot", "wmenu", "waybar", "swaybg", "mako", "wl-clipboard", "playerctl",
  "grim", "slurp", "ffmpeg", "xdg-desktop-portal-wlr",
  "xdg-desktop-portal-gtk",   # what portals.conf sends everything but screen capture to
  "kanshi", "wlr-randr",      # monitor modes and positions: wmon saves them
]
local = ["waylock-arcus"]   # pkg/waylock-arcus: waylock with the bordercolors patch (wlock)

[packages]
pacman = [
  "foot", "wmenu", "waybar", "swaybg", "mako", "wl-clipboard", "playerctl",
  "grim", "slurp", "ffmpeg",
]
local = ["waylock-arcus"]   # pkg/waylock-arcus: waylock with the bordercolors patch (wlock)

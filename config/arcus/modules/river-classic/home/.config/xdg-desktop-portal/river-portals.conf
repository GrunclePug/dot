# prof playground: river ships no portals.conf (mango's, for comparison:
# /usr/share/xdg-desktop-portal/mango-portals.conf). Screen sharing and
# screenshots go through wlr, everything else (file pickers, ...) through gtk.
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.Inhibit=none

# river's terminal (Alt+Shift+Return): roomier padding than the shared
# foot.ini; colours come from the active theme.
[main]
include=~/.config/foot/theme.ini
font=JetBrainsMono Nerd Font:pixelsize=12
pad=10x8

[cursor]
style=block
blink=no

[mouse]
hide-when-typing=yes

[colors-dark]
alpha=0.72
alpha-mode=all

# steam comes from [multilib], which must be enabled in /etc/pacman.conf
# (pacman owns that file, so arcus doesn't change it).
description = "Steam, Prism Launcher, ProtonPlus, protontricks, OpenTTD, GameMode"
category    = "apps"
groups      = ["gamemode"]

[packages]
# flite: Minecraft's narrator (and tether's spoken status) loads libflite on Linux.
# gamemode: the performance CPU governor (and nicer scheduling) only while a game
# runs; start games with "gamemoderun %command%". Its group lets it change the governor.
pacman = ["steam", "prismlauncher", "flite", "protontricks", "openttd", "gamemode", "lib32-gamemode"]
aur    = ["protonplus"]
